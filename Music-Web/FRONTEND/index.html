<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music App — Player</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .player-layout {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 28px;
      align-items: start;
    }

    @media (max-width: 860px) {
      .player-layout { grid-template-columns: 1fr; }
    }

    /* ── Left: Now Playing ───────────────── */
    .now-playing-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 24px 24px;
      text-align: center;
      position: sticky;
      top: 88px;
      animation: fadeIn 0.45s ease both;
    }

    .vinyl-wrap {
      position: relative;
      width: 200px;
      height: 200px;
      margin: 0 auto 24px;
    }

    .vinyl {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center, #222236 0%, #222236 18%, transparent 18.5%),
        repeating-radial-gradient(
          circle at center,
          transparent 0px, transparent 9px,
          rgba(255,255,255,0.025) 9px, rgba(255,255,255,0.025) 10px
        ),
        linear-gradient(135deg, #1a1a2e 0%, #0f0f1e 100%);
      box-shadow: 0 0 0 1px rgba(255,255,255,0.05), var(--shadow);
      animation: spin 7s linear infinite;
      animation-play-state: paused;
      transition: box-shadow 0.4s ease;
    }

    .vinyl::after {
      content: '';
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 36px; height: 36px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), #4638d4);
      box-shadow: 0 0 0 2px rgba(109,90,255,0.4), 0 4px 12px var(--accent-glow);
    }

    .vinyl.playing {
      animation-play-state: running;
      box-shadow: 0 0 60px rgba(109, 90, 255, 0.3), 0 0 0 1px rgba(255,255,255,0.08), var(--shadow);
    }

    .vinyl-groove-1 {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.04);
      pointer-events: none;
    }
    .vinyl-groove-2 {
      position: absolute;
      inset: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.03);
      pointer-events: none;
    }
    .vinyl-groove-3 {
      position: absolute;
      inset: 66px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.03);
      pointer-events: none;
    }

    .now-playing-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent-light);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .now-playing-dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--accent);
      animation: pulse-glow 1.5s ease infinite;
      display: none;
    }

    .now-playing-dot.visible { display: block; }

    .track-name {
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.83rem;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    /* Hidden native audio element */
    .audio-hidden {
      width: 100%;
      margin-bottom: 18px;
      border-radius: var(--radius-sm);
      filter: invert(1) hue-rotate(200deg) brightness(0.7);
      height: 34px;
    }

    .speed-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 4px;
    }

    .speed-label {
      font-size: 0.74rem;
      color: var(--text-faint);
      font-weight: 500;
      margin-right: 4px;
    }

    .speed-btn {
      padding: 5px 12px;
      background: var(--bg-3);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-muted);
      font-family: 'Poppins', sans-serif;
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--trans);
    }

    .speed-btn:hover { background: var(--bg-4); color: var(--text); border-color: var(--border-md); }
    .speed-btn.active { background: var(--accent-dim); color: var(--accent-light); border-color: var(--border-accent); }

    /* ── Right: Song List ────────────────── */
    .songs-panel {
      animation: fadeIn 0.45s ease 0.1s both;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 18px;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .panel-count {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .songs-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .song-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      transition: all 0.22s ease;
      cursor: pointer;
      animation: slideUp 0.4s ease both;
    }

    .song-row:hover {
      background: var(--bg-3);
      border-color: var(--border-accent);
      transform: translateX(4px);
    }

    .song-row.active {
      background: var(--accent-dim);
      border-color: var(--border-accent);
    }

    .song-row-num {
      width: 24px;
      font-size: 0.78rem;
      color: var(--text-faint);
      font-weight: 500;
      text-align: center;
      flex-shrink: 0;
    }

    .song-row.active .song-row-num { display: none; }
    .song-row-playing-icon { display: none; width: 24px; flex-shrink: 0; color: var(--accent-light); }
    .song-row.active .song-row-playing-icon { display: flex; align-items: center; justify-content: center; }

    .song-row-meta { flex: 1; min-width: 0; }

    .song-row-title {
      font-size: 0.88rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-row-bgm {
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .song-row-likes {
      display: flex; align-items: center; gap: 4px;
      font-size: 0.78rem; color: var(--text-muted);
      flex-shrink: 0;
    }

    .song-row-actions {
      display: flex; gap: 6px; flex-shrink: 0;
    }

    .btn-icon {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      border: none; border-radius: 50%;
      cursor: pointer; transition: var(--trans);
    }

    .btn-icon-play {
      background: var(--accent-dim);
      color: var(--accent-light);
    }
    .btn-icon-play:hover { background: var(--accent); color: #fff; transform: scale(1.1); }

    .btn-icon-like {
      background: rgba(239,68,68,0.1);
      color: #f87171;
    }
    .btn-icon-like:hover { background: rgba(239,68,68,0.2); transform: scale(1.1); }

    /* Subscription bar */
    .sub-bar {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .sub-bar-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .sub-bar-text { flex: 1; }
    .sub-bar-label { font-size: 0.85rem; font-weight: 600; }
    .sub-bar-sub   { font-size: 0.78rem; color: var(--text-muted); }

    .sub-progress {
      height: 5px;
      background: var(--bg-4);
      border-radius: 3px;
      margin-top: 8px;
      overflow: hidden;
    }

    .sub-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      border-radius: 3px;
      transition: width 0.5s ease;
    }

    /* Upload action */
    .upload-action {
      margin-top: 14px;
      text-align: center;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state svg { margin: 0 auto 14px; display: block; opacity: 0.25; }
    .empty-state p { font-size: 0.9rem; }
    .empty-state span { font-size: 0.8rem; color: var(--text-faint); display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="navbarContainer"></div>

  <div class="page-wrap">
    <div class="player-layout">

      <!-- LEFT: Player -->
      <div class="now-playing-card">
        <div class="vinyl-wrap">
          <div class="vinyl" id="vinyl">
            <div class="vinyl-groove-1"></div>
            <div class="vinyl-groove-2"></div>
            <div class="vinyl-groove-3"></div>
          </div>
        </div>

        <div class="now-playing-label">
          <div class="now-playing-dot" id="playingDot"></div>
          Now Playing
        </div>
        <div class="track-name" id="trackName">Select a track</div>
        <div class="track-artist" id="trackArtist">—</div>

        <audio id="audioPlayer" class="audio-hidden" controls>
          <source src="songs/sample.mp3" type="audio/mpeg">
        </audio>

        <div class="speed-row">
          <span class="speed-label">Speed</span>
          <button class="speed-btn" onclick="changeSpeed(0.5, this)">0.5×</button>
          <button class="speed-btn active" onclick="changeSpeed(1, this)">1×</button>
          <button class="speed-btn" onclick="changeSpeed(1.5, this)">1.5×</button>
          <button class="speed-btn" onclick="changeSpeed(2, this)">2×</button>
        </div>
      </div>

      <!-- RIGHT: Songs -->
      <div class="songs-panel">
        <div class="panel-header">
          <span class="panel-title">Uploaded Songs</span>
          <span class="panel-count" id="songsCount"></span>
        </div>

        <div class="songs-list" id="uploadsContainer"></div>

        <div class="upload-action">
          <button class="btn btn-primary" onclick="window.location.href='upload.html'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
            Upload a Song
          </button>
        </div>

        <div class="sub-bar" id="subBar">
          <div class="sub-bar-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          </div>
          <div class="sub-bar-text">
            <div class="sub-bar-label" id="subLabel">Premium Subscription</div>
            <div class="sub-bar-sub" id="subSub">Like 10 songs to unlock 5 days free</div>
            <div class="sub-progress">
              <div class="sub-progress-fill" id="subFill" style="width:0%"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
  <script>
    fetch('navbar.html').then(r => r.text()).then(h => {
      document.getElementById('navbarContainer').innerHTML = h;
    });
  </script>
</body>
</html>
