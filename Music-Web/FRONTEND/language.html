<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Select Language — Music App</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      position: relative;
      overflow: hidden;
    }

    .bg-orb {
      position: fixed; border-radius: 50%;
      pointer-events: none; filter: blur(90px); opacity: 0.22;
    }
    .bg-orb-1 { width: 500px; height: 500px; background: radial-gradient(circle, var(--accent), transparent 70%); top: -200px; left: -150px; }
    .bg-orb-2 { width: 400px; height: 400px; background: radial-gradient(circle, var(--cyan), transparent 70%); bottom: -160px; right: -130px; }

    .page-header {
      text-align: center;
      margin-bottom: 48px;
      animation: fadeIn 0.4s ease both;
      position: relative; z-index: 1;
    }

    .page-icon {
      width: 60px; height: 60px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--accent), #4638d4);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 20px;
      box-shadow: 0 8px 32px var(--accent-glow);
    }

    .page-title {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
    }

    .page-subtitle {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .lang-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      width: 100%;
      max-width: 820px;
      position: relative; z-index: 1;
    }

    @media (max-width: 700px) {
      .lang-grid { grid-template-columns: repeat(2, 1fr); }
      .page-title { font-size: 1.6rem; }
    }

    .lang-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 26px 18px 22px;
      text-align: center;
      cursor: pointer;
      transition: all 0.25s ease;
      animation: slideUp 0.4s ease both;
      position: relative;
      overflow: hidden;
    }

    .lang-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--accent-dim), transparent);
      opacity: 0;
      transition: opacity 0.25s ease;
      border-radius: inherit;
    }

    .lang-card:hover {
      border-color: var(--border-accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(109, 90, 255, 0.2);
    }

    .lang-card:hover::before { opacity: 1; }

    .lang-card:active { transform: translateY(-2px); }

    .lang-flag {
      width: 56px; height: 56px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-md);
      margin: 0 auto 14px;
      display: block;
      transition: all 0.25s ease;
    }

    .lang-card:hover .lang-flag {
      border-color: var(--accent);
      box-shadow: 0 4px 18px var(--accent-glow);
    }

    .lang-name {
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      position: relative;
    }

    .lang-card:nth-child(1) { animation-delay: 0.05s; }
    .lang-card:nth-child(2) { animation-delay: 0.10s; }
    .lang-card:nth-child(3) { animation-delay: 0.15s; }
    .lang-card:nth-child(4) { animation-delay: 0.20s; }
    .lang-card:nth-child(5) { animation-delay: 0.25s; }
    .lang-card:nth-child(6) { animation-delay: 0.30s; }
    .lang-card:nth-child(7) { animation-delay: 0.35s; }
    .lang-card:nth-child(8) { animation-delay: 0.40s; }

    .footer-note {
      margin-top: 44px;
      font-size: 0.8rem;
      color: var(--text-faint);
      position: relative; z-index: 1;
    }
  </style>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="page-header">
    <div class="page-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="2" y1="12" x2="22" y2="12"/>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
      </svg>
    </div>
    <h1 class="page-title">Choose a Language</h1>
    <p class="page-subtitle">Select the language of music you want to explore</p>
  </div>

  <div class="lang-grid">
    <div class="lang-card" onclick="selectLanguage('English')">
      <img class="lang-flag" src="https://flagcdn.com/w80/gb.png" alt="English" />
      <div class="lang-name">English</div>
    </div>
    <div class="lang-card" onclick="selectLanguage('Telugu')">
      <img class="lang-flag" src="https://flagcdn.com/w80/in.png" alt="Telugu" />
      <div class="lang-name">Telugu</div>
    </div>
    <div class="lang-card" onclick="selectLanguage('Hindi')">
      <img class="lang-flag" src="https://flagcdn.com/w80/in.png" alt="Hindi" />
      <div class="lang-name">Hindi</div>
    </div>
    <div class="lang-card" onclick="selectLanguage('Tamil')">
      <img class="lang-flag" src="https://flagcdn.com/w80/in.png" alt="Tamil" />
      <div class="lang-name">Tamil</div>
    </div>
    <div class="lang-card" onclick="selectLanguage('Malayalam')">
      <img class="lang-flag" src="https://flagcdn.com/w80/in.png" alt="Malayalam" />
      <div class="lang-name">Malayalam</div>
    </div>
    <div class="lang-card" onclick="selectLanguage('Kannada')">
      <img class="lang-flag" src="https://flagcdn.com/w80/in.png" alt="Kannada" />
      <div class="lang-name">Kannada</div>
    </div>
    <div class="lang-card" onclick="selectLanguage('Spanish')">
      <img class="lang-flag" src="https://flagcdn.com/w80/es.png" alt="Spanish" />
      <div class="lang-name">Spanish</div>
    </div>
    <div class="lang-card" onclick="selectLanguage('French')">
      <img class="lang-flag" src="https://flagcdn.com/w80/fr.png" alt="French" />
      <div class="lang-name">French</div>
    </div>
  </div>

  <p class="footer-note">Music App &copy; 2025</p>

  <script>
    function selectLanguage(language) {
      localStorage.setItem('selectedLanguage', language);

      // Brief visual feedback before redirect
      const cards = document.querySelectorAll('.lang-card');
      cards.forEach(c => c.style.opacity = '0.4');
      window.location.href = 'playlist.html';
    }
  </script>
</body>
</html>
