<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Premium Activated — Music App</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      overflow: hidden;
      position: relative;
      text-align: center;
    }

    /* Animated background particles */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .particle {
      position: absolute;
      border-radius: 50%;
      animation: float-up linear infinite;
      opacity: 0;
    }

    @keyframes float-up {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 1; }
      90%  { opacity: 0.6; }
      100% { transform: translateY(-10vh) scale(1); opacity: 0; }
    }

    /* Background glow orbs */
    .bg-orb {
      position: fixed; border-radius: 50%;
      pointer-events: none; filter: blur(80px);
    }
    .bg-orb-1 {
      width: 500px; height: 500px; opacity: 0.2;
      background: radial-gradient(circle, #f59e0b, transparent 70%);
      top: -200px; left: -100px;
    }
    .bg-orb-2 {
      width: 400px; height: 400px; opacity: 0.15;
      background: radial-gradient(circle, var(--accent), transparent 70%);
      bottom: -150px; right: -100px;
    }

    /* Main card */
    .success-card {
      position: relative;
      z-index: 1;
      max-width: 480px;
      width: 100%;
      background: rgba(15, 15, 30, 0.85);
      border: 1px solid rgba(245, 158, 11, 0.25);
      border-radius: var(--radius-lg);
      padding: 48px 44px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: var(--shadow-lg), 0 0 60px rgba(245, 158, 11, 0.1);
      animation: float 4s ease-in-out infinite;
    }

    .success-icon {
      width: 72px; height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 24px;
      box-shadow: 0 8px 32px rgba(245, 158, 11, 0.4);
      animation: pulse-glow 2s ease infinite;
    }

    .success-title {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #fbbf24, #f59e0b, #ffffff);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .success-subtitle {
      font-size: 1rem;
      color: var(--text-muted);
      margin-bottom: 32px;
    }

    .features-list {
      list-style: none;
      text-align: left;
      margin-bottom: 32px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: rgba(245, 158, 11, 0.06);
      border: 1px solid rgba(245, 158, 11, 0.12);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 500;
      animation: slideUp 0.4s ease both;
    }

    .feature-item:nth-child(1) { animation-delay: 0.1s; }
    .feature-item:nth-child(2) { animation-delay: 0.2s; }
    .feature-item:nth-child(3) { animation-delay: 0.3s; }

    .feature-check {
      width: 28px; height: 28px; border-radius: 8px;
      background: rgba(245, 158, 11, 0.15);
      display: flex; align-items: center; justify-content: center;
      color: #fbbf24; flex-shrink: 0;
    }

    .go-btn {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: var(--trans);
      box-shadow: 0 4px 20px rgba(245, 158, 11, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .go-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
      box-shadow: 0 6px 28px rgba(245, 158, 11, 0.5);
    }

    /* Countdown ring */
    .countdown-wrap {
      position: relative;
      z-index: 1;
      margin-top: 28px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.82rem;
      color: var(--text-faint);
    }

    .countdown-ring {
      width: 36px; height: 36px; flex-shrink: 0;
    }

    .countdown-ring circle {
      fill: none;
      stroke: var(--bg-3);
      stroke-width: 3;
    }

    .countdown-ring .ring-fill {
      stroke: #f59e0b;
      stroke-dasharray: 283;
      stroke-dashoffset: 0;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: center;
      animation: countDown 5s linear forwards;
    }

    .countdown-num {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.7rem;
      font-weight: 700;
      color: #fbbf24;
    }
  </style>
</head>
<body>
  <div class="particles" id="particles"></div>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="success-card">
    <div class="success-icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    </div>

    <h1 class="success-title">Premium Activated</h1>
    <p class="success-subtitle">You've unlocked 5 days of free Premium access</p>

    <ul class="features-list">
      <li class="feature-item">
        <div class="feature-check">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        Ad-free listening experience
      </li>
      <li class="feature-item">
        <div class="feature-check">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        Free Hello Tune on any song
      </li>
      <li class="feature-item">
        <div class="feature-check">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        Access to Premium Playlists
      </li>
    </ul>

    <button class="go-btn" onclick="goToPlayer()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
      Go to Music Player
    </button>
  </div>

  <div class="countdown-wrap">
    <div style="position:relative">
      <svg class="countdown-ring" viewBox="0 0 36 36">
        <circle cx="18" cy="18" r="15"/>
        <circle class="ring-fill" cx="18" cy="18" r="15"/>
      </svg>
      <span class="countdown-num" id="countNum">5</span>
    </div>
    <span>Redirecting to your music player in <strong id="countTxt">5</strong> seconds</span>
  </div>

  <script>
    // Floating particles
    const container = document.getElementById('particles');
    const colors = ['#f59e0b', '#fbbf24', '#6d5aff', '#a78bfa', '#ffffff'];
    for (let i = 0; i < 40; i++) {
      const p = document.createElement('div');
      p.className = 'particle';
      const size = 3 + Math.random() * 5;
      p.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random() * 100}%;
        background:${colors[Math.floor(Math.random() * colors.length)]};
        animation-duration:${4 + Math.random() * 6}s;
        animation-delay:${Math.random() * 4}s;
        opacity:0;
      `;
      container.appendChild(p);
    }

    // Countdown
    let seconds = 5;
    const countNum = document.getElementById('countNum');
    const countTxt = document.getElementById('countTxt');

    const timer = setInterval(() => {
      seconds--;
      countNum.textContent = seconds;
      countTxt.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        goToPlayer();
      }
    }, 1000);

    function goToPlayer() {
      clearInterval(timer);
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
