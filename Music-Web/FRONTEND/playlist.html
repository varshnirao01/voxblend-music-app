<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playlist — Music App</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .playlist-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 32px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .playlist-title-wrap h1 {
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }

    .playlist-title-wrap p {
      font-size: 0.875rem;
      color: var(--text-muted);
    }

    .playlist-actions {
      display: flex;
      gap: 10px;
    }

    .songs-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .song-card {
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      transition: all 0.25s ease;
      animation: slideUp 0.4s ease both;
    }

    .song-card:hover {
      border-color: var(--border-accent);
      transform: translateY(-4px);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
    }

    .song-cover-wrap {
      position: relative;
      aspect-ratio: 1;
      background: var(--bg-3);
      overflow: hidden;
    }

    .song-cover {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }

    .song-card:hover .song-cover { transform: scale(1.05); }

    .cover-fallback {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--bg-3), var(--bg-4));
      color: var(--text-faint);
    }

    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.45);
      opacity: 0;
      transition: opacity 0.25s ease;
    }

    .song-card:hover .play-overlay { opacity: 1; }

    .play-overlay-btn {
      width: 52px; height: 52px;
      background: white;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: var(--bg);
      transform: scale(0.85);
      transition: transform 0.2s ease;
      cursor: pointer;
      border: none;
    }

    .song-card:hover .play-overlay-btn { transform: scale(1); }
    .play-overlay-btn:hover { transform: scale(1.08) !important; background: #f0f0ff; }

    .song-info {
      padding: 16px 18px 18px;
    }

    .song-title {
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-artist {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 14px;
    }

    .song-audio {
      width: 100%;
      height: 36px;
      border-radius: 6px;
      outline: none;
      filter: invert(1) hue-rotate(200deg) brightness(0.8);
      opacity: 0.9;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 24px;
      color: var(--text-muted);
    }

    .empty-state svg {
      margin: 0 auto 16px;
      display: block;
      opacity: 0.3;
    }

    .empty-state p { font-size: 1rem; color: var(--text-muted); }
    .empty-state span { font-size: 0.85rem; color: var(--text-faint); display: block; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="navbarContainer"></div>

  <div class="page-wrap">
    <div class="playlist-header">
      <div class="playlist-title-wrap">
        <h1 id="langTitle">Playlist</h1>
        <p id="langSubtitle">Loading songs...</p>
      </div>
      <div class="playlist-actions">
        <button class="btn btn-secondary" onclick="window.location.href='language.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Languages
        </button>
        <button class="btn btn-primary" onclick="window.location.href='upload.html'">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
          Upload Song
        </button>
      </div>
    </div>

    <div class="songs-grid" id="songsList"></div>
  </div>

  <script>
    fetch('navbar.html').then(r => r.text()).then(h => {
      document.getElementById('navbarContainer').innerHTML = h;
    });

    const lang       = localStorage.getItem('selectedLanguage');
    const langTitle  = document.getElementById('langTitle');
    const langSub    = document.getElementById('langSubtitle');
    const songsList  = document.getElementById('songsList');

    const defaultSongs = {
      Telugu: [
        {
          title: 'Butta Bomma',
          artist: 'Armaan Malik',
          cover: 'https://i.scdn.co/image/ab67616d0000b2735d506b5ddf8cfde260fe56a7',
          fileUrl: 'songs/buttabomma.mp3'
        },
        {
          title: 'Samajavaragamana',
          artist: 'Sid Sriram',
          cover: 'https://i.scdn.co/image/ab67616d0000b273b16a482c8f58b06b7c6b2668',
          fileUrl: 'songs/samajavaragamana.mp3'
        },
        {
          title: 'Inkem Inkem Kaavaale',
          artist: 'Sid Sriram',
          cover: 'https://i.scdn.co/image/ab67616d0000b273f05e72ce7acdc1781edb1ff9',
          fileUrl: 'songs/inkem.mp3'
        }
      ],
      English: [
        {
          title: 'On My Way',
          artist: 'Alan Walker',
          cover: 'https://i.scdn.co/image/ab67616d0000b2734037d0c833f8a6b205e3e5a4',
          fileUrl: 'songs/sample.mp3'
        }
      ]
    };

    if (!lang) {
      langTitle.textContent = 'No Language Selected';
      langSub.textContent   = 'Go back and choose a language to see songs';
      renderEmpty();
    } else {
      langTitle.textContent = lang + ' Songs';
      const songs = defaultSongs[lang] || [];
      langSub.textContent   = songs.length + ' track' + (songs.length !== 1 ? 's' : '') + ' available';
      renderSongs(songs);
    }

    function renderSongs(songs) {
      songsList.innerHTML = '';

      if (songs.length === 0) {
        renderEmpty();
        return;
      }

      songs.forEach((song, i) => {
        const card = document.createElement('div');
        card.className = 'song-card';
        card.style.animationDelay = (i * 0.08) + 's';

        const safeTitle = song.title.replace(/'/g, "\\'");
        const safeUrl   = song.fileUrl.replace(/'/g, "\\'");

        card.innerHTML = `
          <div class="song-cover-wrap">
            <img class="song-cover" src="${song.cover}" alt="${song.title}"
              onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
            <div class="cover-fallback" style="display:none">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            </div>
            <div class="play-overlay">
              <button class="play-overlay-btn" onclick="document.getElementById('audio-${i}').play()">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
              </button>
            </div>
          </div>
          <div class="song-info">
            <div class="song-title">${song.title}</div>
            <div class="song-artist">${song.artist}</div>
            <audio class="song-audio" id="audio-${i}" controls>
              <source src="${song.fileUrl}" type="audio/mpeg">
            </audio>
          </div>
        `;
        songsList.appendChild(card);
      });
    }

    function renderEmpty() {
      songsList.innerHTML = `
        <div class="empty-state">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
          <p>No songs available for this language</p>
          <span>Try selecting a different language or upload your own</span>
        </div>
      `;
    }
  </script>
</body>
</html>
