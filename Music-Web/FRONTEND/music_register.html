<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Music App</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
      opacity: 0.3;
    }
    .bg-orb-1 {
      width: 480px; height: 480px;
      background: radial-gradient(circle, var(--cyan), transparent 70%);
      top: -160px; right: -160px;
    }
    .bg-orb-2 {
      width: 440px; height: 440px;
      background: radial-gradient(circle, var(--accent), transparent 70%);
      bottom: -140px; left: -140px;
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: rgba(15, 15, 30, 0.85);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 44px 40px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: var(--shadow-lg);
      animation: fadeIn 0.5s ease both;
      position: relative;
      z-index: 1;
    }

    .auth-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 28px;
    }
    .auth-logo-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--cyan), #0097a0);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 6px 24px var(--cyan-dim);
    }
    .auth-logo span {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .auth-heading {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 4px;
    }
    .auth-subheading {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 26px;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .auth-submit {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, var(--cyan), #0097a0);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-family: 'Poppins', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--trans);
      box-shadow: 0 4px 20px var(--cyan-dim);
      margin-top: 8px;
      letter-spacing: 0.01em;
    }
    .auth-submit:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
      box-shadow: 0 6px 28px rgba(0, 212, 180, 0.35);
    }
    .auth-submit:active { transform: translateY(0); }

    .auth-links {
      margin-top: 20px;
      text-align: center;
    }
    .auth-links p { font-size: 0.84rem; color: var(--text-muted); }
    .auth-links a { color: var(--accent-light); text-decoration: none; font-weight: 500; transition: var(--trans); }
    .auth-links a:hover { color: #fff; text-decoration: underline; }

    .msg-box {
      padding: 11px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 14px;
      display: none;
    }
    .msg-box.error {
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #f87171;
    }
    .msg-box.success {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    .strength-bar {
      height: 3px;
      border-radius: 2px;
      background: var(--bg-4);
      margin-top: 6px;
      overflow: hidden;
    }
    .strength-fill {
      height: 100%;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease, background 0.3s ease;
    }
  </style>
</head>
<body>
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/>
          <circle cx="9" cy="7" r="4"/>
          <line x1="19" y1="8" x2="19" y2="14"/>
          <line x1="22" y1="11" x2="16" y2="11"/>
        </svg>
      </div>
      <span>Music App</span>
    </div>

    <h1 class="auth-heading">Create account</h1>
    <p class="auth-subheading">Join and start listening today</p>

    <div id="msgBox" class="msg-box"></div>

    <form id="registerForm" autocomplete="off">
      <div class="form-row">
        <div class="input-wrap">
          <label for="fullname">Full Name</label>
          <div class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
          <input type="text" id="fullname" placeholder="Your name" required />
        </div>

        <div class="input-wrap">
          <label for="username">Username</label>
          <div class="input-icon">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93A10 10 0 1 0 4.93 19.07"/><path d="M20.49 9A9 9 0 1 1 9 3.51"/></svg>
          </div>
          <input type="text" id="username" placeholder="Choose username" required />
        </div>
      </div>

      <div class="input-wrap">
        <label for="email">Email Address</label>
        <div class="input-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <input type="email" id="email" placeholder="you@example.com" required />
      </div>

      <div class="input-wrap">
        <label for="password">Password</label>
        <div class="input-icon">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <input type="password" id="password" placeholder="Create a strong password" required id="password" />
        <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
      </div>

      <button type="submit" class="auth-submit" id="submitBtn">Create Account</button>
    </form>

    <div class="auth-links">
      <p>Already have an account? <a href="login.html">Sign in</a></p>
    </div>
  </div>

  <script>
    const form       = document.getElementById('registerForm');
    const msgBox     = document.getElementById('msgBox');
    const submitBtn  = document.getElementById('submitBtn');
    const pwdInput   = document.getElementById('password');
    const strengthFill = document.getElementById('strengthFill');

    function showMsg(type, text) {
      msgBox.className = 'msg-box ' + type;
      msgBox.textContent = text;
      msgBox.style.display = 'block';
    }

    pwdInput.addEventListener('input', () => {
      const v = pwdInput.value;
      let score = 0;
      if (v.length >= 8) score++;
      if (/[A-Z]/.test(v)) score++;
      if (/[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      const pct = (score / 4) * 100;
      const colors = ['#ef4444', '#f97316', '#eab308', '#22c55e'];
      strengthFill.style.width = pct + '%';
      strengthFill.style.background = colors[score - 1] || 'transparent';
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fullname = document.getElementById('fullname').value.trim();
      const username = document.getElementById('username').value.trim();
      const email    = document.getElementById('email').value.trim();
      const password = pwdInput.value;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      try {
        const res  = await fetch('http://localhost:5000/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ fullname, email, username, password }),
        });
        const data = await res.json();

        if (res.ok) {
          showMsg('success', 'Account created! Redirecting to login...');
          setTimeout(() => { window.location.href = 'login.html'; }, 1000);
        } else {
          showMsg('error', data.message || 'Registration failed. Please try again.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Create Account';
        }
      } catch {
        showMsg('error', 'Cannot connect to server. Please try again later.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });
  </script>
</body>
</html>
